[[rules.allowlists]]
description = "The public BIP-39 test vectors (all-zero, all-one, 0x7f and 0x80 entropy) used by our tests"
regexTarget = "match"
regexes = [
  '''^abandon(?:\W+abandon)*(?:\W+(?:about|agent|art))?$''',
  '''^zoo(?:\W+zoo)*(?:\W+(?:wrong|when|vote))?$''',
  '''^legal\W+winner\W+thank\W+year\W+wave\W+sausage\W+worth\W+useful\W+legal\W+winner\W+thank\W+(?:yellow|year)$''',
  '''^letter\W+advice\W+cage\W+absurd\W+amount\W+doctor\W+acoustic\W+avoid\W+letter\W+advice\W+cage\W+(?:above|absurd)$''',
]

# A `.hollow` backup holds the identity and its databases under a passphrase;
# the passphrase next to the file (or in a script) undoes that protection.
[[rules]]
id = "hollow-backup-passphrase"
description = "Passphrase of a .hollow backup or device-link snapshot"
regex = '''(?i)(?:backup|restore|export|import|hollow|link|snapshot|duress|unlock)[\w.-]{0,25}?pass(?:phrase|word)["']?[ \t]*(?::|=|=>|,)[ \t]*["']([^"'\s]{8,128})["']'''
secretGroup = 1
entropy = 3.0
keywords = ["passphrase", "password"]

[[rules]]
id = "hollow-backup-file"
description = "A .hollow backup or identity file committed to the repo"
path = '''(?i)(?:\.hollow|(?:^|/)identity\.(?:key|duress)|(?:^|/)pending_link\.[\w.]+)$'''

# Raw 32-byte Ed25519/X25519 seeds: the update-manifest signing key, the shop's
# support-credential root, a device or master seed.
[[rules]]
id = "hollow-hex-seed"
description = "64-hex private seed assigned to a key-like name"
regex = '''(?i)(?:seed|secret[_-]?key|private[_-]?key|signing[_-]?key|root[_-]?key|issuer[_-]?key)["']?[ \t]*(?::|=|=>)[ \t]*["']?([0-9a-f]{64})\b'''
secretGroup = 1
entropy = 3.0
keywords = ["seed", "secret", "private", "signing", "root", "issuer"]

[[rules]]
id = "hollow-key-file"
description = "A private key or seed file committed to the repo"
path = '''(?i)(?:^|/)[\w.-]+\.(?:key|seed)$'''

# --- Relay and server-side services ----------------------------------------

# Self-hosted relay access keys: four groups of four [A-Z0-9].
[[rules]]
id = "hollow-relay-license-key"
description = "Relay access key from keys.json"
regex = '''(?i)(?:"keys"[ \t]*:[ \t]*\[[^\]]{0,1000}?|license[_-]?key["']?[ \t]*(?::|=|=>|,|\()[ \t]*)["']((?-i:[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}))["']'''
secretGroup = 1
keywords = ["\"keys\"", "license"]
[[rules.allowlists]]
description = "The made-up examples in relay-uws/README.md and SELF_HOSTING.md"
regexTarget = "secret"
regexes = ['''^(?:AB12-CD32-BA30-LJ50|QQ44-RT19-ZZ08-MN71)$''']

[[rules]]
id = "hollow-relay-keys-file"
description = "A relay keys.json committed to the repo (gitignored on purpose)"
path = '''(?:^|/)keys\.json$'''

# coturn's static-auth-secret signs every TURN credential the relay hands out.
[[rules]]
id = "hollow-turn-static-secret"
description = "TURN REST static secret (coturn static-auth-secret / TURN_SECRET)"
regex = '''(?i)(?:static[-_]auth[-_]secret|turn[-_]?(?:static[-_]?|shared[-_]?)?secret)["']?[ \t]*(?::|=|=>|,|[ \t])[ \t]*["']?([A-Za-z0-9+/=_.\-]{16,256})'''
secretGroup = 1
entropy = 3.0
keywords = ["static-auth-secret", "static_auth_secret", "turn_secret", "turn-secret", "turnsecret", "turn_static", "turn_shared"]

# The push sidecar's Firebase service account can push to every Hollow phone.
[[rules]]
id = "hollow-gcp-service-account"
description = "Google/Firebase service account JSON (private_key_id)"
regex = '''"private_key_id"[ \t]*:[ \t]*"([0-9a-f]{40})"'''
secretGroup = 1
keywords = ["private_key_id"]

[[rules]]
id = "hollow-gcp-service-account-file"
description = "A Firebase/GCP service account file committed to the repo"
path = '''(?i)(?:^|/)[\w.-]*(?:service[-_]?account|firebase-adminsdk)[\w.-]*\.json$'''

[[rules]]
id = "hollow-fcm-server-key"
description = "Legacy FCM server key"
regex = '''\b(AAAA[A-Za-z0-9_-]{7}:[A-Za-z0-9_-]{140})\b'''
secretGroup = 1
keywords = ["aaaa"]

# The shop's Ko-fi webhook trusts a request by its verification token alone.
[[rules]]
id = "hollow-kofi-verification-token"
description = "Ko-fi webhook verification token"
regex = '''(?i)(?:ko-?fi|verification)[\w.-]{0,30}?(?:token|secret)["']?[ \t]*(?::|=|=>|,)[ \t]*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
secretGroup = 1
keywords = ["kofi", "ko-fi", "verification"]

[[rules]]
id = "hollow-webhook-secret"
description = "Webhook signing secret or token"
regex = '''(?i)webhook[\w.-]{0,30}?(?:secret|token|key|signature)["']?[ \t]*(?::|=|=>|,)[ \t]*["']?([A-Za-z0-9_\-+/=.]{16,256})'''
secretGroup = 1
entropy = 3.3
keywords = ["webhook"]

[[rules]]
id = "hollow-discord-webhook-url"
description = "Discord webhook URL"
regex = '''https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/\d+/([\w-]{60,})'''
secretGroup = 1
keywords = ["discord"]

[[rules]]
id = "hollow-local-env-file"
description = "A machine-local secrets file committed to the repo (gitignored on purpose)"
path = '''(?:^|/)(?:release\.local\.env|\.env(?:\.local|\.production)?|config\.php|LocalSigning\.xcconfig)$'''

# --- Release signing -------------------------------------------------------

# Certum code signing (Windows), Apple Developer ID and notarisation, Android
# upload keys and the flatpak repo's GPG key.
[[rules]]
id = "hollow-codesign-file"
description = "Code-signing key material committed to the repo"
path = '''(?i)\.(?:pfx|p12|pvk|spc|snk|jks|keystore|p8|mobileprovision|provisionprofile)$|(?:^|/)(?:secring\.gpg|[\w.-]*(?:secret|private)[\w.-]*\.(?:gpg|asc|kbx))$'''

[[rules]]
id = "hollow-signing-password"
description = "Password or PIN of a signing key"
regex = '''(?i)(?:store|key|keystore|cert(?:ificate)?|pfx|p12|signing|certum|codesign|signtool|notary|notarization|gpg|simplysign)[_-]?(?:pass(?:word|phrase)?|pin|pwd)["']?[ \t]*(?::|=|=>)[ \t]*["']?([^\s"'$%{}()<>]{4,128})'''
secretGroup = 1
entropy = 2.0
keywords = ["pass", "pin", "pwd"]
[[rules.allowlists]]
description = "Placeholders and the Android SDK's public debug keystore password"
regexTarget = "secret"
regexes = ['''^(?i:android|changeit|password|xxxx+|\*+|none|null|true|false|example\w*|placeholder\w*|your\w*)$''']

[[rules]]
id = "hollow-signtool-password"
description = "Password passed to signtool on the command line"
regex = '''(?i)signtool(?:\.exe)?\b[^\n]{0,300}?[ \t]/p[ \t]+["']?([^\s"']{4,128})'''
secretGroup = 1
keywords = ["signtool"]

[[rules]]
id = "hollow-apple-app-password"
description = "Apple app-specific password (notarytool / altool)"
regex = '''(?i)(?:--password|app[-_]?specific[-_]?password|notary[\w-]*pass\w*|apple[-_]?(?:id[-_]?)?pass\w*)[^\n]{0,40}?\b((?-i:[a-z]{4}-[a-z]{4}-[a-z]{4}-[a-z]{4}))\b'''
secretGroup = 1
keywords = ["password", "pass"]

# --- Reviewed false positives ----------------------------------------------

[[allowlists]]
description = "Generated or vendored text: third-party license texts, lockfile checksums, OpenSSL headers"
paths = [
  '''(?:^|/)assets/rust_licenses\.txt$''',
  '''(?:^|/)assets/extra_licenses\.txt$''',
  '''(?:^|/)(?:Cargo|pubspec|Podfile)\.lock$''',
  '''^rust/hollow_core/\.cargo/android-openssl-headers/''',
]

[[allowlists]]
description = "Placeholders in examples and docs (change-me, your-turn-secret-here, ...)"
targetRules = ["hollow-turn-static-secret", "hollow-webhook-secret", "hollow-backup-passphrase", "hollow-signing-password", "generic-api-key"]
regexTarget = "secret"
regexes = ['''(?i)^[a-z0-9_.\-]*(?:change[-_]?me|your[-_]|paste[-_]|example|placeholder|replace[-_]?(?:me|with)|[-_]here$|xxxx)[a-z0-9_.\-]*$''']

[[allowlists]]
description = "Widget keys (peer, server and message ids) in the UI navigation map, not credentials"
targetRules = ["generic-api-key"]
paths = ['''(?:^|/)UI_NAVIGATION_MAP\.md$''']
