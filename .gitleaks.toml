# gitleaks configuration: the upstream default rules plus Hollow's own secrets.
#
# CI (.github/workflows/ci.yml, "Supply Chain") scans the WHOLE history on
# every push, and `.pre-commit-config.yaml` scans staged changes before a
# commit. Run from the repo root, gitleaks picks up this file and
# .gitleaksignore by itself:
#   gitleaks git --redact --log-opts=--all .
# A finding is fixed by removing the secret AND rotating it; a reviewed false
# positive goes into an allowlist below with its reason, or, for one
# historical line, its fingerprint goes into .gitleaksignore (`gitleaks dir`
# fingerprints differ, so a working-tree scan still lists those lines).

title = "Hollow gitleaks config"
minVersion = "v8.25.0"

[extend]
useDefault = true

# --- Identity --------------------------------------------------------------

# A BIP-39 recovery phrase is the root of a Hollow identity (it recovers the
# master and can order a remote wipe), so twelve words of it in a file are a
# full account takeover. The alternation is the 2048-word English list as a
# trie (list SHA-256 2f5eed53a4727b4bf8880d8f3f199efc90e58503646d9ff8eff3a2ed3b24dbda),
# so ordinary prose rarely matches. Words may be space separated or a quoted
# list; one word per line is not caught.
[[rules]]
id = "hollow-bip39-mnemonic"
description = "BIP-39 recovery phrase (12 or more words from the English list)"
