# cargo-fuzz targets for the parsers a peer, the relay, a push or a file reaches before
# trust: `run.sh` builds, seeds and runs them (wiki rust_crypto, "Fuzzing the Rust wire
# parsers"). `image_check` compiles src/node/image_check.rs on its own (it depends on
# `image` alone); keep `image` on the app's exact version and features.
[package]
name = "hollow_core_fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
image = { version = "=0.25.10", default-features = false, features = ["webp", "png", "jpeg", "gif", "bmp"] }
# The wire-parser targets reach the app's parsers through `hollow_core::fuzz_entry`,
# a module that exists only under cargo-fuzz's `--cfg fuzzing` (and in its tests).
hollow_core = { path = ".." }

[[bin]]
name = "image_check"
path = "fuzz_targets/image_check.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[profile.release]
debug = 1

