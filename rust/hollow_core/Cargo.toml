[package]
name = "hollow_core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "net", "io-util", "process"] }
rusqlite = { version = "0.34", features = ["bundled-sqlcipher"] }
hex = "0.4"
sha2 = "0.10"
bip39 = "2.2"
dirs = "6"
getrandom = "0.3"
vodozemac = "0.9"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
crdts = "7.3"
openmls = "0.8"
openmls_rust_crypto = "0.5"
openmls_basic_credential = "0.5"
openmls_traits = "0.5"
openmls_memory_storage = "0.5"
image = { version = "0.25", default-features = false, features = ["webp", "png", "jpeg", "gif", "bmp"] }
webp-animation = "0.9"
scraper = "0.26"
reed-solomon-erasure = "6.0"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# SOCKS5 client — routes the relay WSS connection through the local shoes
# REALITY tunnel when anti-censorship proxy mode is on (Socks5Stream::connect).
tokio-socks = "0.5"
futures-util = "0.3"
aes-gcm = "0.10"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
bs58 = "0.5"
zip = { version = "2", default-features = false, features = ["deflate"] }
argon2 = "0.5"
# Pure-Rust Opus (libopus transpiled via c2rust) — decodes screen-share audio
# packets on mobile. Pure Rust = no cmake/NDK, rides the existing cross-compile.
unsafe-libopus = "0.2"
# DeepFilterNet3 AI noise suppression engine (HOLLOW_PLAN ~2008). The C ABI
# the capture-processor ports bind lives in src/dfn_ffi.rs; the engine +
# offline harness live in the sibling crate.
hollow_dfn = { path = "../hollow_dfn" }

[target.'cfg(target_os = "android")'.dependencies]
# JNI exports for the fork's DfnBridge.java (see dfn_ffi.rs).
jni = "0.21"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# The screen-share audio codec must run at REALTIME on phones even in DEBUG
# app builds (debug APK = dev-profile Rust): unoptimized c2rust-transpiled
# code is 10-50x slower than -O3, and a debug build couldn't Opus-encode music
# as fast as it played — device-proven 2026-07-04 ("encode backlog" drops →
# gappy shared audio). Optimizing just this crate keeps dev build times sane.
[profile.dev.package.unsafe-libopus]
opt-level = 3

# Image pipeline (avatar/banner/emote WebP): decode (png/fdeflate, zune-jpeg,
# gif, image-webp), Lanczos3 resize (image), WebP encode (image-webp lossless;
# webp-animation/libwebp-sys2 lossy + animated). Same dev-profile trap as
# unsafe-libopus above — unoptimized builds made processAvatar take ~5 seconds
# per pick, which read as a broken profile editor.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.color_quant]
opt-level = 3
[profile.dev.package.webp-animation]
opt-level = 3
[profile.dev.package.libwebp-sys2]
opt-level = 3

# AI noise suppression (hollow_dfn → nnnoiseless / deep_filter → tract):
# runs on the REALTIME capture audio thread — 10 ms budget per frame. Same
# dev-profile trap as unsafe-libopus: unoptimized inference cannot hit
# realtime in debug builds.
[profile.dev.package.hollow_dfn]
opt-level = 3
[profile.dev.package.nnnoiseless]
opt-level = 3
[profile.dev.package.deep_filter]
opt-level = 3
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-pulse]
opt-level = 3
[profile.dev.package.tract-pulse-opl]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.ndarray]
opt-level = 3
[profile.dev.package.matrixmultiply]
opt-level = 3
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.realfft]
opt-level = 3
[profile.dev.package.num-complex]
opt-level = 3
[profile.dev.package.half]
opt-level = 3
