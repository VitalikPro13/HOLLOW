[package]
name = "spike_str0m"
version = "0.1.0"
edition = "2021"
description = "THROWAWAY media-forwarding spike (D2): prove str0m <-> Hollow's libwebrtc m144 fork can pass one SFrame-encrypted screen share through a blind RTP hop. Deleted after the spike. See reports/MEDIA_FORWARDING_PLAN.md."
publish = false

[dependencies]
str0m = "0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "io-util"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rand = { version = "0.8", features = ["small_rng"] }
