# One workflow, one Rust run per push.
#
# It used to be two files: rust-coverage.yml (Codecov) and sonar.yml (Sonar),
# each running `cargo llvm-cov --lib` in full. That is the same ~950s suite
# twice, and rust-coverage.yml was path-filtered to rust/hollow_core/** while
# sonar.yml triggered on everything, so a pure-Dart commit paid for a full
# Rust run and got no Dart checks at all.
#
# Now: the Rust suite runs ONCE under nextest, sharded over parallel jobs,
# and publishes lcov.info and clippy-report.json as artifacts; Sonar consumes
# them. The path filter is gone on purpose. Every push runs Rust so that every
# Sonar analysis carries a fresh coverage report (skipping it makes Sonar
# report the Rust core as having no coverage data at all).
#
# Every third-party action is pinned to a commit SHA, not a tag. A tag is a
# mutable pointer: whoever can move `v4` can run their code with this
# workflow's token and secrets. The trailing comment names the release the
# SHA belongs to so Dependabot (.github/dependabot.yml) can bump both together.

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN across every job. Nothing here writes to the
# repo: the two upload/download-artifact steps authenticate with the Actions
# runtime token (not GITHUB_TOKEN), Codecov uploads with CODECOV_TOKEN and
# Sonar with SONAR_TOKEN, both from secrets. A job that ever does need more
# must ask for it at the job level, not here.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # The Rust suite: one instrumented build, the tests split over parallel
  # shards, one coverage report merged from all of them. Its time is the
  # multi-node harness, ~550 CPU-bound tests capped at 4 at once per runner
  # (the `harness` group in rust/hollow_core/.config/nextest.toml), so one
  # runner cannot go faster and each added shard divides it.
  rust-build:
    name: Rust test build
    runs-on: ubuntu-latest
    env:
      # Coverage reads the instrumentation's own mapping, not DWARF, and
      # backtraces keep file:line. Full debuginfo for hollow_core only made
      # the archive every shard downloads several times larger.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only

    steps:
      # persist-credentials: false — checkout otherwise leaves GITHUB_TOKEN in
      # .git/config for every later step (and anything they shell out to).
      # Nothing in this workflow pushes, so it never needs to be on disk.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rustup ships on the runner image. The action that used to wrap it was
      # pinned to a commit its regenerated `stable` branch no longer holds
      # (zizmor: impostor-commit), and a commit no ref holds can be collected.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      # Keeps the built dependencies (hollow_core itself always rebuilds),
      # keyed per job. Pull requests restore but never save: they used to
      # write 4 GB caches that pushed main's out of the repository's 10 GB,
      # and main then rebuilt every dependency on every push.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/hollow_core -> target
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Install cargo-llvm-cov & cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Build the instrumented test archive
        working-directory: rust/hollow_core
        run: cargo llvm-cov nextest-archive --lib --archive-file "$RUNNER_TEMP/hollow-tests.tar.zst"

      - name: Publish the test archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-test-archive
          path: ${{ runner.temp }}/hollow-tests.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  rust-test:
    name: Rust tests (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: rust-build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      # The tests read the source tree at run time (source scans, vectors),
      # at the same path the archive was built from.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - name: Install cargo-llvm-cov & cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Download the test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-test-archive
          path: ${{ runner.temp }}

      # `--profile ci` selects [profile.ci] in rust/hollow_core/.config/
      # nextest.toml (retries, pinned test-threads, the harness and os-keychain
      # groups). `slice` deals the name-sorted tests out round-robin, so every
      # shard gets an even share of the harness, which sorts as one block.
      - name: Tests (nextest)
        working-directory: rust/hollow_core
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ strategy.job-total }}
        run: |
          mkdir -p target/llvm-cov-target
          cargo llvm-cov nextest --profile ci --no-report \
            --archive-file "$RUNNER_TEMP/hollow-tests.tar.zst" \
            --partition "slice:$SHARD/$SHARDS"

      # One profile per test process, ~2 MB each, merged here to one small
      # indexed profile. It keeps the .profraw name because `cargo llvm-cov
      # report` collects only that name, and llvm-profdata merges indexed
      # inputs exactly as raw ones (the report is byte-identical).
      - name: Merge this shard's coverage profiles
        working-directory: rust/hollow_core/target/llvm-cov-target
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          profdata="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/llvm-profdata"
          "$profdata" merge -sparse ./*.profraw -o "$RUNNER_TEMP/shard-$SHARD.profraw"

      - name: Publish this shard's coverage profile
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-profile-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-${{ matrix.shard }}.profraw
          retention-days: 1
          if-no-files-found: error

  rust:
    # DO NOT RENAME. "Test & Coverage" is the required status check on main
    # (branch protection matches by context name, not by workflow file). It
    # runs even after a failed build or shard and then fails itself: a job
    # skipped for a failed `needs` counts as passing for branch protection.
    name: Test & Coverage
    needs: [rust-build, rust-test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest

    steps:
      - name: Every shard passed
        env:
          BUILD: ${{ needs.rust-build.result }}
          TESTS: ${{ needs.rust-test.result }}
        run: |
          echo "build: $BUILD, tests: $TESTS"
          [ "$BUILD" = success ] && [ "$TESTS" = success ]

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - name: Install cargo-llvm-cov & cargo-nextest
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-llvm-cov,cargo-nextest

      - name: Download the test archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-test-archive
          path: ${{ runner.temp }}

      - name: Download every shard's coverage profile
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: rust-profile-*
          merge-multiple: true
          path: rust/hollow_core/target/llvm-cov-target

      # The report reads the instrumented binary where a shard's run unpacks
      # it. The ignore-regex is the Codecov scoping. Sonar drops the same
      # paths via `sonar.coverage.exclusions` in sonar-project.properties, so
      # ONE lcov.info serves both consumers.
      - name: Coverage report
        working-directory: rust/hollow_core
        run: |
          tar --zstd -xf "$RUNNER_TEMP/hollow-tests.tar.zst" -C target/llvm-cov-target
          cargo llvm-cov report --nextest-archive-file "$RUNNER_TEMP/hollow-tests.tar.zst" \
            --lcov --output-path lcov.info \
            --ignore-filename-regex "(frb_generated|/api/|/node/|/storage/|/archive/)"

      - name: Publish coverage for the Sonar job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage
          path: rust/hollow_core/lcov.info
          retention-days: 1
          if-no-files-found: error

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: rust/hollow_core/lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # Sonar imports this instead of invoking cargo itself (Cargo.toml is not at
  # the repo root). Its own job, so it builds beside the tests.
  clippy:
    name: Clippy report
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust/hollow_core -> target
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Generate Clippy report for Sonar
        working-directory: rust/hollow_core
        run: cargo clippy --lib --message-format=json > ../../clippy-report.json

      - name: Publish the report for the Sonar job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-clippy
          path: clippy-report.json
          retention-days: 1
          if-no-files-found: error

  supply-chain:
    # Dependencies, secrets and these workflows (SECURITY_AUDIT_PLAN.md 2.8,
    # items 1-2). Its own job so a new advisory or leak reads as its own red
    # check, in about a minute rather than after the coverage build.
    #
    # Every accepted finding is listed with its reason: rust/deny.toml,
    # osv-scanner.toml, .gitleaks.toml and .gitleaksignore. Anything not listed
    # fails the job. No step needs a repository secret.
    name: Supply Chain
    runs-on: ubuntu-latest

    steps:
      # Full history, because gitleaks reads every commit, not only this push.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install cargo-deny, osv-scanner and zizmor
        uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-deny@0.20.2,osv-scanner@2.5.1,zizmor@1.30.1

      # RustSec advisories, licences, banned crates (openssl, native-tls) and
      # sources, once per Cargo.lock. The ignore list is shared, so the smaller
      # crates do not warn about ignored advisories they never contained.
      - name: cargo deny
        run: |
          cargo deny --manifest-path rust/hollow_core/Cargo.toml --config rust/deny.toml --locked check
          for crate in hollow_dfn hollow_art hollow_manifest; do
            cargo deny --manifest-path "rust/$crate/Cargo.toml" --config rust/deny.toml --locked check \
              --allow advisory-not-detected --allow unmatched-source
          done

      # OSV also carries GitHub-only advisories that RustSec lacks, and is the
      # only scanner of the Dart lockfiles.
      - name: osv-scanner
        if: ${{ !cancelled() }}
        run: >-
          osv-scanner scan source --config osv-scanner.toml
          -L pubspec.lock
          -L packages/scrollable_positioned_list/pubspec.lock
          -L rust_builder/cargokit/build_tool/pubspec.lock
          -L rust/hollow_core/Cargo.lock
          -L rust/hollow_dfn/Cargo.lock
          -L rust/hollow_art/Cargo.lock
          -L rust/hollow_manifest/Cargo.lock

      # The release binary, checked against the digest its release published.
      - name: gitleaks (whole history)
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts=--all .

      # Informational findings (style) do not fail the job. The read-only token
      # lets zizmor ask GitHub whether each pinned SHA is on its action's repo
      # and whether that version has a known advisory.
      - name: zizmor
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --no-progress --min-severity low .github/

  relay:
    # The relay's C++ unit suites, plain and under AddressSanitizer + UBSan
    # (the first sanitized run caught a use-after-free in the kill list), and a
    # release build of the relay itself. A couple of minutes, so it runs on
    # every push like the rest of this workflow.
    name: Relay C++
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends cmake g++ libssl-dev libsodium-dev zlib1g-dev

      - name: Unit tests
        run: bash relay-uws/test/run_tests.sh

      - name: Unit tests under ASan and UBSan
        run: SANITIZE=1 bash relay-uws/test/run_tests.sh

      - name: Build the relay
        run: |
          cmake -S relay-uws -B relay-uws/build -DCMAKE_BUILD_TYPE=Release
          cmake --build relay-uws/build -j"$(nproc)"

      - name: Relay feed library
        run: bash relay-uws/test/release_feed/run_tests.sh

      - name: Relay tarball packing
        run: bash relay-uws/test/release_feed/build_tree_tests.sh

      - name: Relay installer
        run: bash relay-uws/test/installer/run_tests.sh

  dart:
    name: Dart Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          # Pinned to the version the project develops on. Bump both this and
          # the sonar job's pin together on a Flutter upgrade.
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      # Errors only. The tree currently carries 113 pre-existing info/warning
      # items; gating on those would fail the job on day one for reasons that
      # have nothing to do with the commit under test.
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      # 670 tests, ~35s, no device needed. These are the "CI-guarded"
      # invariants CLAUDE.md keeps referring to (call-hold-open, the a11y
      # label guard, context menus, reverse chat lists, centre tabs), and
      # until now not one of them was actually running in CI.
      - name: Widget tests
        run: flutter test test/

  sonar:
    name: Analyze
    needs: [rust, clippy]
    # Neither a Dependabot run nor a pull request from a fork receives
    # repository secrets, so SONAR_TOKEN is empty and the scan can only fail
    # with "Not authorized". A fork's commits are analysed when they land on
    # main, not before.
    if: >-
      github.actor != 'dependabot[bot]'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so Sonar can attribute new vs old code
          fetch-depth: 0
          persist-credentials: false

      # Both land exactly where sonar-project.properties expects them.
      - name: Download Rust coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-coverage
          path: rust/hollow_core

      - name: Download the Clippy report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-clippy

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      # Resolve package imports so the Dart analyzer doesn't emit
      # phantom "URI doesn't exist" issues for every dependency.
      - name: Flutter pub get
        run: flutter pub get

      # SONAR_TOKEN is the only credential this needs. PR decoration is done
      # by the SonarQube Cloud GitHub App, not by GITHUB_TOKEN, so the job
      # stays on the workflow's read-only default.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
