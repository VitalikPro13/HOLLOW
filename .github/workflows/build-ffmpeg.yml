name: Build Minimal FFmpeg

on:
  workflow_dispatch:

# Read-only by default. The build job below clones and compiles four upstream
# C projects from the network, which is exactly the job that should not be
# holding a token that can write to this repo. Only `release` asks for
# contents: write, and it does nothing but publish the artifact.
permissions:
  contents: read

jobs:
  build-windows:
    runs-on: ubuntu-latest
    outputs:
      size: ${{ steps.package.outputs.size }}
    steps:
      # persist-credentials: false — nothing here pushes, so GITHUB_TOKEN has
      # no reason to sit in .git/config while third-party source is built.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cross-compilation toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 nasm pkg-config yasm autoconf automake libtool git

      - name: Build libopus (static, Windows x64)
        run: |
          git clone --depth 1 --branch v1.5.2 https://github.com/xiph/opus.git /tmp/opus
          cd /tmp/opus
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32 --prefix=/tmp/ffmpeg-deps \
            --disable-shared --enable-static --disable-doc --disable-extra-programs
          make -j$(nproc)
          make install

      - name: Build libwebp (static, Windows x64)
        run: |
          git clone --depth 1 --branch v1.4.0 https://chromium.googlesource.com/webm/libwebp /tmp/libwebp
          cd /tmp/libwebp
          autoreconf -fiv
          ./configure --host=x86_64-w64-mingw32 --prefix=/tmp/ffmpeg-deps \
            --disable-shared --enable-static --disable-wic --disable-gif \
            --disable-tiff --disable-jpeg --disable-png --disable-sdl
          make -j$(nproc)
          make install

      - name: Build libogg (static, Windows x64)
        run: |
          git clone --depth 1 --branch v1.3.5 https://github.com/xiph/ogg.git /tmp/ogg
          cd /tmp/ogg
          ./autogen.sh
          ./configure --host=x86_64-w64-mingw32 --prefix=/tmp/ffmpeg-deps \
            --disable-shared --enable-static
          make -j$(nproc)
          make install

      - name: Build FFmpeg (minimal, static, Windows x64)
        run: |
          git clone --depth 1 --branch n7.1 https://github.com/FFmpeg/FFmpeg.git /tmp/ffmpeg
          cd /tmp/ffmpeg

          export PKG_CONFIG_PATH=/tmp/ffmpeg-deps/lib/pkgconfig
          export PKG_CONFIG_LIBDIR=/tmp/ffmpeg-deps/lib/pkgconfig

          ./configure \
            --arch=x86_64 \
            --target-os=mingw32 \
            --cross-prefix=x86_64-w64-mingw32- \
            --prefix=/tmp/ffmpeg-out \
            --pkg-config=pkg-config \
            --pkg-config-flags="--static" \
            --enable-static \
            --disable-shared \
            --disable-debug \
            --disable-doc \
            --disable-htmlpages \
            --disable-manpages \
            --disable-podpages \
            --disable-txtpages \
            --disable-network \
            --disable-autodetect \
            --disable-programs \
            --enable-ffmpeg \
            --disable-ffplay \
            --disable-ffprobe \
            --enable-small \
            \
            --disable-everything \
            \
            --enable-protocol=file \
            --enable-protocol=pipe \
            \
            --enable-demuxer=pcm_s16le \
            --enable-demuxer=pcm_f32le \
            --enable-demuxer=ogg \
            --enable-demuxer=opus \
            --enable-demuxer=wav \
            --enable-demuxer=mov \
            --enable-demuxer=matroska \
            --enable-demuxer=mp4 \
            --enable-demuxer=image2 \
            --enable-demuxer=image2pipe \
            \
            --enable-muxer=ogg \
            --enable-muxer=wav \
            --enable-muxer=mp4 \
            --enable-muxer=image2 \
            --enable-muxer=image2pipe \
            --enable-muxer=null \
            \
            --enable-decoder=opus \
            --enable-decoder=vorbis \
            --enable-decoder=pcm_s16le \
            --enable-decoder=h264 \
            --enable-decoder=hevc \
            --enable-decoder=vp8 \
            --enable-decoder=vp9 \
            --enable-decoder=mjpeg \
            --enable-decoder=png \
            \
            --enable-encoder=pcm_s16le \
            --enable-encoder=aac \
            --enable-encoder=libwebp \
            --enable-encoder=libopus \
            \
            --enable-parser=opus \
            --enable-parser=vorbis \
            --enable-parser=h264 \
            --enable-parser=hevc \
            --enable-parser=vp8 \
            --enable-parser=vp9 \
            --enable-parser=mjpeg \
            --enable-parser=png \
            \
            --enable-filter=scale \
            --enable-filter=aresample \
            --enable-filter=anull \
            --enable-filter=null \
            \
            --enable-libopus \
            --enable-libwebp \
            \
            --extra-cflags="-I/tmp/ffmpeg-deps/include" \
            --extra-ldflags="-L/tmp/ffmpeg-deps/lib -static"

          make -j$(nproc)
          x86_64-w64-mingw32-strip ffmpeg.exe

      # The size rides a JOB OUTPUT, not $GITHUB_ENV: the release step lives in
      # a separate job now and job environments do not cross.
      - name: Package
        id: package
        run: |
          mkdir -p /tmp/release
          cp /tmp/ffmpeg/ffmpeg.exe /tmp/release/ffmpeg-win-x64.exe
          ls -lh /tmp/release/ffmpeg-win-x64.exe
          echo "size=$(stat -c%s /tmp/release/ffmpeg-win-x64.exe)" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-win-x64-minimal
          path: /tmp/release/ffmpeg-win-x64.exe

  # Publishing is the ONLY thing in this file that needs a writable token, so
  # it is the only thing that gets one. It never checks the repo out and never
  # runs third-party build scripts: it downloads the artifact the build job
  # already produced and attaches it to the release.
  release:
    needs: build-windows
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the built binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-win-x64-minimal

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ffmpeg-minimal-v1
          name: "FFmpeg Minimal Build (Windows x64)"
          body: |
            Minimal static ffmpeg for Hollow.
            Includes: libopus, libwebp, aac, pcm_s16le, scale filter.
            Size: ${{ needs.build-windows.outputs.size }} bytes
          files: ffmpeg-win-x64.exe
          make_latest: false
