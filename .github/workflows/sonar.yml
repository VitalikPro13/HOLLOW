name: SonarQube Cloud

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  sonar:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Sonar can attribute new vs old code
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/hollow_core/target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('rust/hollow_core/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-clippy-

      - name: Generate Clippy report for Sonar
        working-directory: rust/hollow_core
        run: cargo clippy --lib --message-format=json > ../../clippy-report.json

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
