<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 328 628" width="328" height="628">
  <defs>
    <!-- Background radial glow — same palette as YT logo bg -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#1A3D36"/>
      <stop offset="30%" stop-color="#122B27"/>
      <stop offset="60%" stop-color="#0E1820"/>
      <stop offset="100%" stop-color="#0D0F14"/>
    </radialGradient>

    <!-- Teal glow — centered on the logo -->
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#00BFA6" stop-opacity="0.24"/>
      <stop offset="25%" stop-color="#00BFA6" stop-opacity="0.13"/>
      <stop offset="55%" stop-color="#00BFA6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00BFA6" stop-opacity="0.01"/>
    </radialGradient>

    <!-- Outer ambient glow -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="85%">
      <stop offset="40%" stop-color="#00BFA6" stop-opacity="0"/>
      <stop offset="70%" stop-color="#00BFA6" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00BFA6" stop-opacity="0.02"/>
    </radialGradient>

    <!-- H letter gradient -->
    <linearGradient id="hGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5C3"/>
      <stop offset="100%" stop-color="#009980"/>
    </linearGradient>
  </defs>

  <!-- Dark background fill (opaque — fills the whole left panel, no seams) -->
  <rect width="328" height="628" fill="url(#bgGlow)"/>

  <!-- Ambient teal glow layers -->
  <circle cx="164" cy="314" r="340" fill="url(#tealGlow)"/>
  <circle cx="164" cy="324" r="380" fill="url(#outerGlow)"/>

  <!-- ===== LOGO — centered at (164, 314) ===== -->
  <!-- Original logo art is 1000x1000, centered at (500,500). -->
  <!-- scale 0.34, translate so 500*0.34=170 maps to center: (164-170, 314-170) = (-6, 144) -->
  <g transform="translate(-6, 144) scale(0.34)">

    <!-- Logo-local teal glow -->
    <circle cx="500" cy="480" r="500" fill="url(#tealGlow)"/>

    <!-- H with integrated lock — single unified path -->
    <path d="
      M 260 234
      A 14 14 0 0 1 274 220
      L 324 220
      A 14 14 0 0 1 338 234
      L 338 448
      L 400 448
      L 400 412
      L 414 412
      L 414 335
      A 86 86 0 0 1 586 335
      L 586 412
      L 600 412
      L 600 448
      L 662 448
      L 662 234
      A 14 14 0 0 1 676 220
      L 726 220
      A 14 14 0 0 1 740 234
      L 740 766
      A 14 14 0 0 1 726 780
      L 676 780
      A 14 14 0 0 1 662 766
      L 662 536
      L 600 536
      L 600 552
      A 16 16 0 0 1 584 568
      L 416 568
      A 16 16 0 0 1 400 552
      L 400 536
      L 338 536
      L 338 766
      A 14 14 0 0 1 324 780
      L 274 780
      A 14 14 0 0 1 260 766
      L 260 234
      Z
      M 450 412
      L 450 335
      A 50 50 0 0 1 550 335
      L 550 412
      Z
    "
    fill="url(#hGrad)"
    fill-rule="evenodd"
    />

    <!-- Keyhole -->
    <circle cx="500" cy="477" r="18" fill="#0D0F14"/>
    <rect x="493" y="487" width="14" height="34" rx="4" fill="#0D0F14"/>
    <circle cx="500" cy="475" r="5" fill="#00BFA6" opacity="0.5"/>
  </g>
</svg>
