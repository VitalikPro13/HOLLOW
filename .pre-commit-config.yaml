# Optional local hooks (https://pre-commit.com). Enable once per clone:
#   pip install pre-commit
#   pre-commit install
# gitleaks then scans what you stage, with the repo's .gitleaks.toml, before
# the commit is made. CI runs the same config over the whole history.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
