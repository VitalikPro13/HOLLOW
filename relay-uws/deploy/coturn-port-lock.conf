# coturn starts only with the TURN port lock in place, and stops if it goes
# (hollow-turn-port-lock.service). Install beside a coturn unit of its own:
#   sudo install -D -m 0644 coturn-port-lock.conf /etc/systemd/system/coturn.service.d/hollow-port-lock.conf
#   (hollow-coturn.service.d for the setup's hollow-coturn.service)
#   sudo systemctl daemon-reload && sudo systemctl restart coturn
# Never under Docker: dockerd brings coturn's container back without asking systemd,
# so there the lock starts before docker.service instead.
[Unit]
Requires=hollow-turn-port-lock.service
After=hollow-turn-port-lock.service
