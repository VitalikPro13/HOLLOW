# Sandbox for the distribution's coturn unit on the official relay:
#   sudo install -D -m 0644 coturn-sandbox.conf /etc/systemd/system/coturn.service.d/hollow-sandbox.conf
#   sudo systemctl daemon-reload && sudo systemctl restart coturn
# coturn is reachable from the whole internet and holds the TLS key and the
# TURN secret; this keeps a bug in it away from the rest of the box.
[Service]
LimitCORE=0
CapabilityBoundingSet=
NoNewPrivileges=yes
PrivateUsers=yes
ProtectSystem=strict
ReadWritePaths=-/var/lib/turn
ProtectHome=yes
PrivateTmp=yes
PrivateDevices=yes
PrivateIPC=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
ProtectProc=invisible
# AF_NETLINK: coturn lists the interfaces to open one listener per address.
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
RestrictNamespaces=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
MemoryDenyWriteExecute=yes
SystemCallArchitectures=native
SystemCallFilter=@system-service
SystemCallFilter=~@privileged
SystemCallErrorNumber=EPERM
RemoveIPC=yes
UMask=0077
InaccessiblePaths=-/etc/hollow-relay -/etc/hollow-push -/etc/hollow-forwarder
