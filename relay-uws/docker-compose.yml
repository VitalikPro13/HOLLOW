services:
  relay:
    build: .
    ulimits:
      core: 0
    ports:
      - "443:443"
    environment:
      - TURN_SECRET=${TURN_SECRET}
    command:
      - --port
      - "443"
      - --public-ip
      - ${PUBLIC_IP}
      - --domain
      - ${RELAY_DOMAIN}
      - --cert-file
      - /certs/fullchain.pem
      - --key-file
      - /certs/privkey.pem
     ## Uncomment below to use keys.json for license based gating.
     ## See the "License keys format" in relay-uws/README.md
     # - --keys-file
     # - /keys/keys.json
    volumes:
      - certs:/certs:ro
      - ./keys:/keys:ro
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certs:/etc/letsencrypt
      - certbot-www:/var/www/certbot
      - ./deploy/cert-renewed:/renew-signal
    entrypoint:
      - sh
      - -c
      - |
        certbot certonly --standalone --non-interactive --agree-tos \
          --email "${CERTBOT_EMAIL}" \
          -d "${RELAY_DOMAIN}" \
          --deploy-hook "cp /etc/letsencrypt/live/${RELAY_DOMAIN}/fullchain.pem /etc/letsencrypt/fullchain.pem && \
        cp /etc/letsencrypt/live/${RELAY_DOMAIN}/privkey.pem /etc/letsencrypt/privkey.pem && \
        chown 999:999 /etc/letsencrypt/fullchain.pem /etc/letsencrypt/privkey.pem && \
        chmod 600 /etc/letsencrypt/privkey.pem && \
        chmod 644 /etc/letsencrypt/fullchain.pem && \
        touch /renew-signal/.relay-cert-renewed"

        while :; do
          sleep 12h
          certbot renew --quiet \
            --deploy-hook "cp /etc/letsencrypt/live/${RELAY_DOMAIN}/fullchain.pem /etc/letsencrypt/fullchain.pem && \
        cp /etc/letsencrypt/live/${RELAY_DOMAIN}/privkey.pem /etc/letsencrypt/privkey.pem && \
        chown 999:999 /etc/letsencrypt/fullchain.pem /etc/letsencrypt/privkey.pem && \
        chmod 600 /etc/letsencrypt/privkey.pem && \
        chmod 644 /etc/letsencrypt/fullchain.pem && \
        touch /renew-signal/.relay-cert-renewed"
        done
    restart: unless-stopped
    ports:
      - "80:80"

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/turnserver.conf:ro
    restart: unless-stopped

volumes:
  certs:
  certbot-www:
